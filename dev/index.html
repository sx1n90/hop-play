<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Hop in 404</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231A1030'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%2300E5FF' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>

    <!-- Экран загрузки по листу ScreenLoading дизайн-системы: кадр стартового вида игры (небо, туман, две прямые
         полосы с камеры «за спиной», рендер меню Hop → Render Start Backdrop), затемнение, заголовок, полоса
         прогресса и плашка Фильтра. Тексты подставляет скрипт сборки из texts.txt (loading_title, filter_label, loading). -->
    <div id="loader">
      <img class="backdrop" src="TemplateData/start-backdrop.webp" alt="" aria-hidden="true">
      <div class="dim"></div>

      <div class="column">
        <div class="head">
          <div class="route">&nbsp;</div>
          <div id="loading-title" class="title"></div>
          <div class="track"><div id="progress" class="fill"></div></div>
        </div>
        <div class="plate">
          <div id="filter-label" class="plate-label"></div>
          <div id="filter-line" class="plate-line"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script type="application/json" id="loading-texts">{"bar":0.75,"ru":{"title":"Прокладываем маршрут","label":"Фильтр","filter":"Соединение замедлено. Ожидайте"},"en":{"title":"Plotting the route","label":"Filter","filter":"Connection throttled. Please wait"}}</script>
    <script>
      // Язык экрана загрузки: параметр запуска площадки, иначе язык браузера; набор текстов выбран при сборке.
      var texts = {};
      try { texts = JSON.parse(document.getElementById("loading-texts").textContent); } catch (e) {}
      var lang = (new URLSearchParams(location.search).get("vk_language") || navigator.language || "ru").slice(0, 2).toLowerCase();
      var t = texts[lang] || texts.ru || texts.en || {};
      // Доля полосы у загрузчика (скачивание и запуск движка); остаток добегает уже игра на таком же экране.
      var barShare = typeof texts.bar === "number" ? texts.bar : 0.75;
      document.documentElement.lang = texts[lang] ? lang : "ru";
      var title = document.getElementById("loading-title");
      title.textContent = t.title || "";
      document.getElementById("filter-label").textContent = t.label || "";
      document.getElementById("filter-line").textContent = t.filter || "";

      // Заголовок одной строкой: на узком экране шрифт уменьшается, пока не влезет, как и в игре.
      function fitTitle() {
        title.style.fontSize = "";
        var size = parseFloat(getComputedStyle(title).fontSize);
        while (title.scrollWidth > title.clientWidth && size > 8) {
          size -= 1;
          title.style.fontSize = size + "px";
        }
      }
      fitTitle();
      window.addEventListener("resize", fitTitle);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var progressBar = document.querySelector("#progress");

      // Сообщения движка: предупреждение на несколько секунд, ошибка — пока страница открыта.
      function unityShowBanner(msg, type) {
        var warning = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.className = type || "";
        warning.appendChild(div);
        if (type != "error") setTimeout(function () { warning.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webgl-dev.data",
        frameworkUrl: buildUrl + "/webgl-dev.framework.js",
        codeUrl: buildUrl + "/webgl-dev.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hop",
        productName: "Hop in 404",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Экран гаснет по сигналу из игры (WebGLLoader.Ready): под ним уже нарисован такой же экран старта.
      // Если сигнала нет, экран гаснет сам через запас времени, чтобы не закрыть игру навсегда.
      var hidden = false;
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        loader.className = "hidden";
        setTimeout(function () { loader.style.display = "none"; }, 600);
      }
      window.hopLoaderReady = hideLoader;

      var script = document.createElement("script");
      script.src = buildUrl + "/webgl-dev.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBar.style.width = 100 * barShare * progress + "%";
        }).then(function (unityInstance) {
          progressBar.style.width = 100 * barShare + "%";
          setTimeout(hideLoader, 10000);
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
